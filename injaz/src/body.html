<div id="fs" hidden>
  <div class="wm" aria-hidden="true"></div>
  <div id="fsSetup" class="card" style="width:min(460px,92vw);display:flex;flex-direction:column;gap:10px">
    <h2 id="fsTitle" style="margin:0">جلسة تركيز</h2>
    <label class="f">المدة بالدقائق <input type="number" id="fmin" min="1" max="240" value="50"></label>
    <label class="f">الصوت <select id="snd"><option value="amb">موسيقى هادئة</option><option value="dew">قطرات الندى</option><option value="forest">غابة: رياح وطيور</option><option value="water">ماء جارٍ</option><option value="night">ليل وصراصير</option><option value="file">ملفي الصوتي</option><option value="off">بدون صوت</option></select></label>
    <label class="f">مستوى الصوت <input type="range" id="vol" min="0" max="100" value="60"></label>
    <label class="f">جملة تحفيزية كل <select id="qi"><option value="5">5 دقائق</option><option value="60">ساعة</option><option value="0">بدون</option></select></label>
    <label class="row"><input type="checkbox" id="tk" checked> صوت عقارب الساعة</label>
    <label class="f">مستواه <input type="range" id="tv" min="0" max="100" value="50"></label>
    <div class="row"><label class="btn g">اختر ملفاً صوتياً<input type="file" id="aud" accept="audio/*" hidden></label><span class="mut" id="audN"></span></div>
    <div class="row"><button class="btn big" data-a="fgo">ابدأ</button><button class="btn g" data-a="fcancel">إلغاء</button></div>
  </div>
  <div id="fsRun" hidden>
    <div id="fsl"></div><div id="big">50:00</div><div id="fq"></div>
    <div class="ctl"><button class="btn g" id="fp" data-a="fp">إيقاف مؤقت</button><button class="btn g" id="fm" data-a="fm">الصوت: يعمل</button><button class="btn g" id="fx" data-a="fx">إغلاق</button></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>
