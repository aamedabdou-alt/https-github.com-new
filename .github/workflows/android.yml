name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['injaz/**','.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: injaz/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: pip install pillow
      - run: cp ../dist/index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - run: python3 tools/patch_android.py android ../dist
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: injaz-debug-apk
          path: injaz/mobile/android/app/build/outputs/apk/debug/app-debug.apk
