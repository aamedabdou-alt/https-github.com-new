:root{color-scheme:dark;--bg:#0f1318;--card:rgba(23,28,36,.94);--card2:rgba(255,255,255,.035);--ink:#e7eaf0;--mut:#9aa4b2;--line:rgba(255,255,255,.085);--acc:#8aa4f0;--acc2:#7fbfae;--bad:#e58b7b;--ok:#7fbfae;--warn:#e0b970;--onacc:#0f1318;--r:14px;--ui:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;--disp:'Aref Ruqaa','IBM Plex Sans Arabic',serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:calc(var(--sat) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:1rem;line-height:1.75;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body.mo{overflow:hidden}
#skin{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--bg)}
#skin .sk{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;background-size:cover;background-position:center}
#skin .sk.on{opacity:1}
#skin .dim{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .6s}
.wm{position:fixed;left:14px;bottom:calc(14px + var(--sab));width:clamp(56px,8vw,88px);aspect-ratio:.53;border-radius:14px;background:var(--logo) center/contain no-repeat;opacity:.28;pointer-events:none;z-index:3}
body.lock .wrap,body.lock .wm{visibility:hidden}
.wrap{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:0 max(14px,var(--sar)) calc(40px + var(--sab)) max(14px,var(--sal))}
.mut{color:var(--mut)}.sm{font-size:.86rem}.b{font-weight:700}.ac{color:var(--acc)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
h1,h2,h3,h4{margin:0;line-height:1.4}
.ser{font-family:var(--disp)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--field,rgba(255,255,255,.04));border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;font-size:16px}
textarea{width:100%;resize:vertical;line-height:1.7}
select option{color:#111}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none;margin:0}
input[type=range]{padding:0;accent-color:var(--acc);background:none;border:0;min-height:30px}
input[type=color]{padding:2px;height:40px;width:60px}
:is(button,input,select,textarea,a,label.btn):focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:11px;padding:8px 16px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;white-space:nowrap;transition:transform .12s,opacity .2s}

.btn.g{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line)}
.btn.s{padding:4px 11px;min-height:32px;font-size:.88rem;border-radius:9px}
.btn.big{padding:12px 26px;font-size:1.1rem}
.btn.d{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.x{background:none;border:0;color:var(--bad);font-size:1.4rem;cursor:pointer;line-height:1;padding:4px 8px;min-width:36px;min-height:36px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--mut)}

.chip{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.92rem;color:var(--mut);white-space:nowrap;min-height:34px}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
.chips{display:flex;gap:7px;flex-wrap:wrap}
/* top bar + nav */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + var(--sat)) 0 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--disp);font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px var(--acc);flex:none}
#clock{font-variant-numeric:tabular-nums;color:var(--mut);font-size:.9rem;white-space:nowrap}
/* sections */
.sec{display:none}.sec.on{display:block}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 14px}
.sh h2{font-family:var(--disp);font-size:clamp(1.9rem,5vw,2.8rem);font-weight:700;line-height:1.25}
.sh p{margin:2px 0 8px}
.emb{flex:none;display:flex;align-items:center}
.eico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);border:1px solid color-mix(in srgb,var(--acc) 28%,transparent)}
.eico svg{width:30px;height:30px;fill:none;stroke:var(--acc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.full{grid-column:1/-1}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;position:relative}
.card>h3{font-size:1.1rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card>h3 small{font-weight:400;color:var(--mut);font-size:.82rem}
.card.glow{box-shadow:0 0 0 1px var(--acc) inset}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--acc2);width:0;border-radius:9px;transition:width .6s}
.bar.w i{background:var(--warn)}.bar.b i{background:var(--bad)}
.list{list-style:none;padding:0;margin:6px 0 10px}
.list>li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.list>li:first-child{border-top:0}
.list>li>.t{flex:1;min-width:0;overflow-wrap:anywhere}
.list>li.done>.t{text-decoration:line-through;color:var(--mut)}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:.76rem;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.pill.c{color:var(--c);border-color:var(--c)}
.empty{color:var(--mut);padding:14px 0;text-align:center}
.qt{font-family:var(--disp);font-size:1.4rem;line-height:1.9}.qt[dir=ltr]{font-family:var(--ui);font-size:1.02rem;line-height:1.7}
/* rings */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.ringbox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .tr{stroke:var(--line)}.ring .pr{stroke:var(--c,var(--acc));transition:stroke-dashoffset .9s}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-variant-numeric:tabular-nums}
.big-n{font-size:2.4rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .tm{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:700;font-size:.92rem;line-height:1.3}
.tl .tm small{display:block;color:var(--mut);font-weight:400;font-size:.76rem}
.tl li.now{background:rgba(255,255,255,.07);border-radius:12px;box-shadow:0 0 0 1px var(--acc) inset;padding-inline:8px}
.tl li.past{opacity:.55}
.tl li.cf{box-shadow:0 0 0 1px var(--bad) inset;border-radius:12px;padding-inline:8px}
.tl .lb{min-width:0;display:flex;flex-direction:column;gap:2px}
.tl .lb span.t{overflow-wrap:anywhere}
.tl li.dn .t{text-decoration:line-through;color:var(--mut)}
.tl .ac2{display:flex;gap:6px;align-items:center}
.tg-study{--c:#7fb29a}.tg-pray{--c:#e3b866}.tg-lesson{--c:#8fb3ff}.tg-gym{--c:#e8806a}.tg-food{--c:#d9b36c}.tg-rest{--c:#a7b5b1}.tg-read{--c:#e8a1c9}.tg-sleep{--c:#a894ff}.tg-move{--c:#9aa7b4}.tg-school{--c:#c8a27a}.tg-custom{--c:#7fd6c8}
/* misc */
table.tb{border-collapse:collapse;width:100%;min-width:520px;font-size:.92rem}
.tb th,.tb td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb th{color:var(--mut);font-weight:600;font-size:.8rem}
.tb select,.tb input{padding:4px 6px;font-size:.9rem;width:100%}
.scx{overflow-x:auto;margin:0 -4px;padding:0 4px}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars .bv{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--acc2);min-height:3px;transition:height .7s;position:relative}
.bars .bc small{font-size:.7rem;color:var(--mut);white-space:nowrap}
.bars .bc em{font-style:normal;font-size:.72rem;color:var(--ink);font-variant-numeric:tabular-nums}
.bars .ln{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);pointer-events:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.tile{padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.tile b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--mut)}
.sheetwrap,#modal{position:fixed;inset:0;z-index:80;background:rgba(3,6,12,.66);display:flex;align-items:flex-end;justify-content:center;padding:0}
#modal[hidden]{display:none}
.sheet{width:min(640px,100%);max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + var(--sab));background:var(--sheet,#171c24)}
@media(min-width:700px){#modal{align-items:center;padding:20px}.sheet{border-radius:20px}}
.sheet .cl{position:absolute;top:8px;left:8px;color:var(--ink);font-size:1.7rem}
.sheet h3{font-family:var(--disp);font-size:1.5rem;margin-bottom:10px;padding-inline-end:30px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--sab));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.tt{background:var(--sheet,#171c24);border:1px solid var(--acc);border-radius:12px;padding:9px 16px;box-shadow:0 8px 30px rgba(0,0,0,.45);text-align:center}
/* skin tiles */
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.skt{border:2px solid var(--line);border-radius:14px;height:74px;position:relative;cursor:pointer;overflow:hidden;background-size:cover;padding:0;color:#fff;display:flex;align-items:flex-end}
.skt span{display:block;width:100%;padding:3px 8px;font-size:.82rem;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:start}
.skt.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
/* water glass */
.glass{width:132px;height:176px;margin:0 auto;position:relative}
.glass svg{width:100%;height:100%}
/* fullscreen timer */
#fs{position:fixed;inset:0;z-index:150;background:#05080f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sat) 0 var(--sab)}
#fs[hidden]{display:none}

#big{font-size:clamp(4.6rem,26vw,22rem);font-weight:800;color:#fff;line-height:1;direction:ltr;font-variant-numeric:tabular-nums}
#fsl{color:#c8d3d0;font-size:1.1rem;margin-bottom:6px;text-align:center;padding:0 16px}
#fq{position:absolute;bottom:18%;width:min(740px,90vw);text-align:center;color:#e9dfce;opacity:0}
#fs .ctl{position:absolute;bottom:calc(4% + var(--sab));display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:0 10px}
#fs .btn.g{color:#fff;border-color:rgba(255,255,255,.3)}
/* gate */
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(6,11,22,.35)}
#gate[hidden]{display:none}
.gbox{width:min(360px,90vw);display:flex;flex-direction:column;gap:10px;text-align:center}
.gbox h2{font-family:var(--disp);font-size:1.7rem}
.dl{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dl .chip{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.3;padding:6px 14px;border-radius:14px}
.dl .chip small{font-size:.72rem}
.mood{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood button{padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-size:.86rem;color:var(--mut)}
.mood button.on{border-color:var(--c);color:var(--ink);background:rgba(255,255,255,.1);box-shadow:0 0 0 1px var(--c) inset}
.note{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card2);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:110px}
.note h4{font-size:1rem}.note p{margin:0;color:var(--mut);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}

.book{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.book:first-child{border-top:0}
.spine{width:12px;align-self:stretch;border-radius:4px;background:var(--c,var(--acc));flex:none;min-height:54px}
.hero{padding:10px 0 6px}
.hero h1{font-family:var(--disp);font-size:clamp(2.1rem,7vw,3.7rem);line-height:1.3}
.en{font-size:1.05rem;letter-spacing:.14em;color:var(--acc);margin:0 0 6px;direction:ltr;text-align:right}

  .tl li{grid-template-columns:66px 1fr auto;gap:8px}
    .card{padding:14px}
}

.sh p{font-size:.95rem;margin:2px 0 12px}
.card{border-radius:var(--r);padding:18px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px -12px rgba(0,0,0,.45)}
.card>h3{font-size:1.04rem;font-weight:600;margin-bottom:12px;color:var(--ink)}
.grid{gap:16px}
.btn{font-weight:600;border-radius:10px;min-height:40px;letter-spacing:0}
.btn.g{background:var(--card2)}
.btn.g:hover{background:rgba(255,255,255,.07)}
.btn.big{font-size:1.05rem;border-radius:12px}
.chip{border-radius:9px;font-size:.9rem;padding:5px 13px}
.chip.on{font-weight:600}
input,select,textarea{border-radius:9px;background:var(--field,rgba(255,255,255,.035))}
input:focus,select:focus,textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.mut{color:var(--mut)}
.tab{font-size:.74rem;font-weight:500;gap:4px}
.tab.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:600}
.tab.on svg{transform:none}
.tab svg{stroke-width:1.6}
.list>li,.tl li{border-top-color:var(--line)}
.tl li.now{background:color-mix(in srgb,var(--acc) 10%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent) inset}
.tl .tm{color:var(--acc);font-weight:600}
.pill{border-radius:8px}
.hero h1{font-weight:700}
.en{letter-spacing:.12em;font-family:var(--ui);font-weight:500;font-size:.95rem;color:var(--mut)}
.skt{border-radius:12px;border-width:1.5px}
.skt span{background:linear-gradient(transparent,rgba(0,0,0,.55));font-weight:600}
.big-n{font-weight:700}
#big,.nt-t,.ar-t,.ta-t{font-weight:600}
.wm{opacity:.16;border-radius:12px}
body.lt .wm{opacity:.28}
.tt{border-color:var(--line)}
.sheet{border:1px solid var(--line)}
@media(max-width:700px){body{font-size:15.5px}.card{padding:15px}}
.sh{justify-content:flex-start;gap:16px}
.sh>div:first-child{min-width:0}
.emb{order:-1}
body>.wm{display:none}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--logo) center/contain no-repeat}
@media(max-width:700px){.sh{gap:12px}}

/* الخلفيات الفاتحة: بطاقات وقوائم فاتحة منسجمة */
body.lt{color-scheme:light;--card:rgba(255,255,255,.94);--card2:rgba(25,35,55,.045);--ink:#1e2530;--mut:#5b6677;--line:rgba(25,35,55,.11);--sheet:#ffffff;--navbg:rgba(255,255,255,.94);--field:rgba(25,35,55,.04);--bad:#c4513f;--ok:#2f8a73;--warn:#a87a1d}
body.lt .card{box-shadow:0 1px 2px rgba(25,35,55,.06),0 10px 28px -14px rgba(25,35,55,.18)}
body.lt .btn.g:hover{background:rgba(25,35,55,.07)}
body.lt .tab.on{color:#3d5bd0;background:rgba(80,110,220,.12)}
body.lt .ac,body.lt .tl .tm{color:#3d5bd0}
body.lt .skt span,body.lt .brand i{color:#fff}

/* ===== هوية خاصة: ترقيم تحريري وشريط علوي واحد ===== */
.tact{display:flex;align-items:center;gap:6px}
.ib{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card2);cursor:pointer;display:grid;place-items:center;color:var(--mut);transition:color .2s,border-color .2s,background .2s}
.ib:hover{color:var(--ink);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#clock{margin-inline-start:6px;padding-inline-start:12px;border-inline-start:1px solid var(--line)}
.eyb{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--mut);letter-spacing:.06em;margin-bottom:2px}
.eyb b{color:var(--acc);font-weight:600;font-variant-numeric:tabular-nums}
.eyb::before{content:"";width:28px;height:1px;background:var(--acc);opacity:.7;order:1}
.eyb span{order:2;opacity:.7}
.eyb b{order:0}
.sh{padding:22px 2px 18px;border-bottom:1px solid var(--line);margin-bottom:20px}
.sh h2{margin-top:2px}
.sh p{margin:4px 0 0}
.card>h3{position:relative;padding-inline-start:12px}
.card>h3::before{content:"";position:absolute;inset-inline-start:0;top:.32em;bottom:.32em;width:3px;border-radius:3px;background:var(--acc);opacity:.85}
body.img .sh{border-radius:16px}
body.lt .eyb b{color:#3d5bd0}
@media(max-width:700px){.ib{width:36px;height:36px}#clock{display:none}.sh{padding-top:14px}}
#fsSetup[hidden],#fsRun[hidden]{display:none!important}

#auth{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg,#0f1318);overflow:auto}
.auth-in{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center}
.auth-in h1{margin:0;font-size:28px}.auth-in .f{display:flex;flex-direction:column;gap:6px;text-align:right;font-size:13px}
.auth-in input{padding:12px;border-radius:12px;border:1px solid var(--line,#2a3342);background:var(--field,#161c26);color:inherit;font:inherit;font-size:16px}
.auth-logo{width:72px;height:72px;margin:0 auto;border-radius:18px;background:var(--logo) center/cover}
.auth-tabs{justify-content:center}.ar-msg{min-height:18px;font-size:13px;color:#ff8a80}
.ib.pend::after{content:"";position:absolute;top:6px;inset-inline-start:6px;width:8px;height:8px;border-radius:50%;background:#f5b942}
</style>
</head>
<body>
<div id="skin" aria-hidden="true"><div class="sk a"></div><div class="sk b"></div><div class="dim"></div></div>
<div class="wm" aria-hidden="true"></div>
<div class="wrap">
<header class="top"><div class="brand"><i></i><b>إنجاز</b></div><div class="tact"><button class="ib" data-a="bgsheet" aria-label="تغيير الخلفية"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></button><button class="ib" data-a="themesheet" aria-label="ألواني"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 1.5-2.2-.5-1.2.2-2.3 1.6-2.3H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="8" cy="11" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16" cy="10" r="1"/></svg></button><span id="clock" class="num"></span></div></header>
<nav id="tabs" aria-label="الأقسام"></nav>
<main id="main"></main>
</div>
<div id="fs" hidden>
  <div class="wm" aria-hidden="true"></div>
  <div id="fsSetup" class="card" style="width:min(460px,92vw);display:flex;flex-direction:column;gap:10px">
    <h2 id="fsTitle" style="margin:0">جلسة تركيز</h2>
    <label class="f">المدة بالدقائق <input type="number" id="fmin" min="1" max="240" value="50"></label>
    <label class="f">الصوت <select id="snd"><option value="amb">موسيقى هادئة</option><option value="dew">قطرات الندى</option><option value="forest">غابة: رياح وطيور</option><option value="water">ماء جارٍ</option><option value="night">ليل وصراصير</option><option value="file">ملفي الصوتي</option><option value="off">بدون صوت</option></select></label>
    <label class="f">مستوى الصوت <input type="range" id="vol" min="0" max="100" value="60"></label>
    <label class="f">جملة تحفيزية كل <select id="qi"><option value="5">5 دقائق</option><option value="60">ساعة</option><option value="0">بدون</option></select></label>
    <label class="row"><input type="checkbox" id="tk" checked> صوت عقارب الساعة</label>
    <label class="f">مستواه <input type="range" id="tv" min="0" max="100" value="50"></label>
    <div class="row"><label class="btn g">اختر ملفاً صوتياً<input type="file" id="aud" accept="audio/*" hidden></label><span class="mut" id="audN"></span></div>
    <div class="row"><button class="btn big" data-a="fgo">ابدأ</button><button class="btn g" data-a="fcancel">إلغاء</button></div>
  </div>
  <div id="fsRun" hidden>
    <div id="fsl"></div><div id="big">50:00</div><div id="fq"></div>
    <div class="ctl"><button class="btn g" id="fp" data-a="fp">إيقاف مؤقت</button><button class="btn g" id="fm" data-a="fm">الصوت: يعمل</button><button class="btn g" id="fx" data-a="fx">إغلاق</button></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" hidden></div>

};

CHG.bgfile=async t=>{
  const f=t.files&&t.files[0];if(!f)return;
  try{
    const bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u});
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));
    await bgTx('readwrite',s=>s.put(blob,'img'));
    if(bgUrl)URL.revokeObjectURL(bgUrl);bgUrl=URL.createObjectURL(blob);
    cfg.bg.custom={kind:'image',color:cfg.bg.custom.color||'#101820',lum:lumOfCanvas(cv)};
    bgScope='all';cfg.bg.mode='fixed';cfg.bg.fixed='custom';cfg.bg.per={};
    saveCfg();applySkin();openBg();toast('تم تعيين صورتك كخلفية');
  }catch(e){toast('تعذر قراءة الصورة')}
  t.value='';
};
function lumOfRGB(r,g,b){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)}
function lumOfHex(h){h=(h||'#000').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return lumOfRGB(parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16))}
function lumOfCanvas(cv){const t=document.createElement('canvas');t.width=t.height=24;const x=t.getContext('2d');x.drawImage(cv,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let s=0,n=0;for(let i=0;i<d.length;i+=4){s+=lumOfRGB(d[i],d[i+1],d[i+2]);n++}return s/n}
async function loadBgImg(){try{const b=await bgTx('readonly',s=>s.get('img'));if(b){bgUrl=URL.createObjectURL(b);if(cfg.bg.custom&&cfg.bg.custom.lum==null){const bm=await createImageBitmap(b),c=document.createElement('canvas');c.width=c.height=48;c.getContext('2d').drawImage(bm,0,0,48,48);cfg.bg.custom.lum=lumOfCanvas(c);saveCfg()}}}catch(e){}}

let ac,mg,nb,bus,live=[],clearFn=null,on=false,fileUrl=null,tkAlt=false;const aud=new Audio();aud.loop=true;

const echo=(t,fb)=>{const d=ac.createDelay(1),g=ac.createGain();d.delayTime.value=t;g.gain.value=fb;d.connect(g);g.connect(d);d.connect(bus);return d};

amb(){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.connect(bus);f.connect(echo(.45,.45));

dew(){const e=echo(.38,.4);noise(250,'lowpass',1,.04);

const WSTART=['03:00','03:30','04:00','04:30','05:00','05:30','06:00','07:00','08:00','14:00','15:00','16:00','17:00','18:00','19:00'],WEND=['06:30','07:00','07:30','08:00','08:30','09:00','10:00','12:00','16:00','17:00','18:00','19:00','20:00','21:00'];
const PALETTE=['#8fb3ff','#e8a1c9','#7fd6c8','#e3b866','#b8a5ff','#ff9f6b'];
RD.study=()=>{
  const k=td(),w=wdOf(k),win=winOf(w),mb=morning(k),sd=st.get('sdone',{})[k]||{},fMin=sum(mb.filter(x=>x.type==='focus').map(x=>x.e-x.s));
  const P=prayers(k);
  const blocks=mb.length?'<ul class="tl">'+mb.map(b=>{
    if(b.type==='pray')return '<li class="tg-pray"><div class="tm">'+t12(b.s)+'<small>الفجر ≈ '+t12(P.fajr)+'</small></div><div class="lb"><span class="t">صلاة الفجر وأذكار الصباح</span></div><span class="pill c" style="--c:#e3b866">عبادة</span></li>';
    const s=sub(b.subj),dn=!!sd[b.i];
    return '<li class="'+(dn?'dn ':'')+(nowMin()>=b.s&&nowMin()<b.e?'now':'')+'"><div class="tm">'+t12(b.s)+'<small>'+(b.e-b.s)+' د</small></div><div class="lb"><span class="t"><b style="color:'+s.c+'">●</b> '+esc(s.n)+'</span></div><div class="ac2"><button class="btn s" data-a="blk" data-i="'+b.i+'">ابدأ</button><input type="checkbox" data-c="blkdone" data-i="'+b.i+'" '+(dn?'checked':'')+' aria-label="تمت"></div></li>'}).join('')+'</ul>':'<div class="empty">لا توجد كتل ضمن هذه النافذة. وسّع وقت الدراسة.</div>';
  const winCard=card('جدول المذاكرة: '+DN[w],
    '<div class="row"><label class="f">بداية الدراسة<select data-c="wstart">'+opts(WSTART.map(x=>[x,t12(pm(x))]),win[0])+'</select></label><label class="f">النهاية<select data-c="wend">'+opts(WEND.map(x=>[x,t12(pm(x))]),win[1])+'</select></label><button class="btn g s" data-a="winall" style="align-self:flex-end">تعميم على كل الأيام</button></div>'+
    '<div class="mut sm" style="margin:8px 0">جلسة '+cfg.focus+' دقيقة ثم راحة '+cfg.brk+' دقائق. وقت الفجر محسوب لمدينتك ويتغيّر تلقائياً مع الفصول.</div>'+blocks+
    '<div class="row sp sm mut" style="margin-top:8px"><span>مخطط: '+dur(fMin)+'</span><span>أُنجز اليوم: '+dur(D.study(k))+'</span></div>'+bar(fMin?D.study(k)/fMin:0));
  const free=card('جلسة حرة','<div class="row"><label class="f">المادة<select id="fsub">'+subs().concat([{k:'rev',n:'مراجعة'}]).map(s=>'<option value="'+s.k+'">'+esc(s.n)+'</option>').join('')+'</select></label><label class="f">الدقائق<input type="number" id="fmn" min="5" max="240" value="50" style="width:90px"></label><button class="btn big" data-a="freeStart" style="align-self:flex-end">ابدأ بملء الشاشة</button></div><div class="mut sm" style="margin-top:8px">شاشة سوداء ورقم كبير وصوت هادئ وجمل تحفيزية. جلسات اليوم: '+(st.get('done',{})[k]||0)+'</div>');
  const dayRows=WORD.map(d=>{const wn=winOf(d),pl=planOf(d);return '<tr><td class="b">'+DN[d]+(lessonish(d)?'<br><small class="mut">'+(cfg.arabic.days.includes(d)?'عربي ':'')+(cfg.prog.days.includes(d)?'برمجة':'')+'</small>':'')+'</td><td><select data-c="wstartD" data-w="'+d+'">'+opts(WSTART.map(x=>[x,t12(pm(x))]),wn[0])+'</select></td><td><select data-c="wendD" data-w="'+d+'">'+opts(WEND.map(x=>[x,t12(pm(x))]),wn[1])+'</select></td>'+[0,1,2,3].map(i=>'<td><select data-c="plansel" data-w="'+d+'" data-i="'+i+'">'+opts(subs().concat([{k:'rev',n:'مراجعة'}]).map(s=>[s.k,s.n]),pl[i])+'</select></td>').join('')+'</tr>'}).join('');
  const plan=card('خطة الأسبوع','<div class="mut sm" style="margin-bottom:6px">اختر مادة لكل كتلة. التاريخ محجوز في الخطة عدة مرات أسبوعياً حتى تبدأه براحتك.</div><div class="scx"><table class="tb" style="min-width:760px"><thead><tr><th>اليوم</th><th>يبدأ</th><th>ينتهي</th><th>الكتلة 1</th><th>الكتلة 2</th><th>الكتلة 3</th><th>الكتلة 4</th></tr></thead><tbody>'+dayRows+'</tbody></table></div>',{cls:'full'});
  const les=(key,title,extra)=>{const c=cfg[key];return '<div style="border-top:1px solid var(--line);padding:10px 0"><div class="row sp"><label class="f grow" style="flex:1">اسم الدرس<input type="text" data-c="lesname" data-k="'+key+'" value="'+esc(c.name||title)+'"></label>'+(key==='eng'?'<label class="row sm"><input type="checkbox" data-c="lesOn" data-k="eng" '+(c.on?'checked':'')+'> مفعّلة</label>':'')+'</div><div class="row" style="margin:6px 0"><label class="f">الوقت<input type="time" data-c="les" data-k="'+key+'" data-f="time" value="'+c.time+'"></label><label class="f">المدة (د)<input type="number" min="15" max="300" data-c="les" data-k="'+key+'" data-f="dur" value="'+c.dur+'" style="width:84px"></label>'+(key==='prog'?'<label class="f">الانتقال (د)<input type="number" min="0" max="120" data-c="les" data-k="prog" data-f="trav" value="'+c.trav+'" style="width:84px"></label>':'')+'</div>'+dayChips(c.days,'lday').replace(/data-a="lday"/g,'data-a="lday" data-k="'+key+'"')+(extra?'<div class="mut sm" style="margin-top:6px">'+extra+'</div>':'')+'</div>'};
  const lessons=card('دروسي','<div class="mut sm">تدخل هذه المواعيد تلقائياً في الروتين والتنبيهات.</div>'+les('arabic','الدرس الأول','')+les('prog','الدرس الثاني (خارج البيت)','الانتقال يُحسب ذهاباً وإياباً.')+les('eng','حصة أونلاين','تظهر كمذاكرة في الجدول في الأيام المحددة.'));
  const hist=(st.get('topics',{}).hist||[]).length===0&&stCur==='hist';
  const L=(st.get('topics',{})[stCur])||[],dn=L.filter(o=>o.d).length;
  const topics=card('موادي','<div class="chips" id="sChips">'+subs().map(s=>chip(s.k===stCur,'data-a="subpick" data-k="'+s.k+'"',esc(s.n))).join('')+'</div>'+
    '<div class="row sp sm mut" style="margin-top:8px"><span>'+esc(sub(stCur).n)+'</span><span>'+dn+'/'+L.length+'</span></div>'+bar(L.length?dn/L.length:0)+
    (L.length?'<ul class="list">'+L.map((o,i)=>'<li class="'+(o.d?'done':'')+'"><input type="checkbox" data-c="topchk" data-i="'+i+'" '+(o.d?'checked':'')+' aria-label="تم"><span class="t">'+esc(o.x)+'</span><button class="x" data-a="topdel" data-i="'+i+'" aria-label="حذف">×</button></li>').join('')+'</ul>':'<div class="empty">لا دروس بعد. أضف درساً من كتاب الوزارة.</div>')+
    (stCur==='hist'&&L.length===0?'<div class="callout"><b>لم تبدأ التاريخ بعد؟</b><br><span class="mut sm">جاهز لك مسار بداية من خمس خطوات، يوفّر عليك التفكير.</span><br><button class="btn s" data-a="histkit" style="margin-top:6px">أضف مسار البداية</button></div>':'')+
    '<div class="row" style="margin-top:8px"><input type="text" id="sIn" class="grow" placeholder="أضف درساً" data-en="#sAdd"><button class="btn" id="sAdd" data-a="topadd">أضف</button></div>'+
    '<div class="row" style="margin-top:10px"><input type="text" id="subIn" class="grow" placeholder="إضافة مادة جديدة" data-en="#subAdd"><button class="btn g" id="subAdd" data-a="subadd">مادة</button></div>');
  const sm=D.smin(k),sbars=subs().concat([{k:'rev',n:'مراجعة',c:'#b8a5ff'}]).filter(s=>sm[s.k]).map(s=>'<div class="row sp sm"><span>'+esc(s.n)+'</span><span class="num">'+dur(sm[s.k])+'</span></div><div class="bar"><i style="width:'+clamp(sm[s.k]/Math.max(60,fMin)*100,0,100)+'%;background:'+(sub(s.k).c)+'"></i></div>').join('');
  const wk=ago(7).map(d=>({l:DN[wdOf(d)].slice(0,3),v:D.study(d)/60,c:d===k?'var(--acc)':null}));
  const weekTot=sum(ago(7).map(d=>D.study(d)));
  let streak=0;for(let i=0;i<60;i++){if(D.study(addDays(k,-i))>=30)streak++;else if(i>0)break;else if(i===0)continue}
  const stats=card('إحصاءات','<div class="tiles" style="margin-bottom:10px"><div class="tile"><b>'+dur(D.study(k))+'</b><span>اليوم</span></div><div class="tile"><b>'+(weekTot/60).toFixed(1)+' س</b><span>آخر 7 أيام</span></div><div class="tile"><b>'+streak+'</b><span>أيام متتالية (30 د فأكثر)</span></div></div>'+(sbars||'<div class="mut sm">لم تُسجَّل مذاكرة اليوم بعد.</div>')+'<div class="mut sm" style="margin-top:10px">الساعات يومياً</div>'+bars(wk,{fmt:v=>v.toFixed(1)}));
  return '<div class="grid">'+winCard+free+lessons+plan+topics+stats+'</div>';
};

CHG.wend=t=>{const k=td(),w=wdOf(k),c=winOf(w);cfg.win[w]=[c[0],t.value];saveCfg();renderSec('study')};
CHG.wstartD=t=>{const w=+t.dataset.w,c=winOf(w);cfg.win[w]=[t.value,c[1]];saveCfg();renderSec('study')};

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.en&&e.target.tagName==='INPUT'){e.preventDefault();const b=$(e.target.dataset.en);if(b)b.click()}});

/* ========== المهام ========== */
const TASKS=()=>st.get('tasks',[]),saveTasks=a=>st.set('tasks',a);
const TCATS=['دراسة','برمجة','عربي','تاريخ','إنجليزي','تمارين','أكل','شخصي','قراءة','أخرى'];
const PRI={1:['عالية','#e8806a'],2:['متوسطة','#e3b866'],3:['منخفضة','#7fb29a']};
const LEADS=[[-1,'بدون تنبيه'],[0,'عند الموعد'],[5,'قبلها بـ 5 د'],[10,'قبلها بـ 10 د'],[30,'قبلها بـ 30 د'],[60,'قبلها بساعة']];
let tFilter='today',tSort='pri',tQ='';
const isLate=t=>{const k=td();return !t.done&&t.due&&(t.due<k||(t.due===k&&t.tm&&pm(t.tm)<nowMin()))};
function taskToday(){const k=td();return{done:D.tdone(k),open:TASKS().filter(t=>!t.done&&t.due&&t.due<=k).length}}
function taskList(f,sortBy,q){
  const k=td();let a=TASKS();
  if(f==='today')a=a.filter(t=>!t.done&&t.due&&t.due<=k);
  else if(f==='up')a=a.filter(t=>!t.done&&t.due&&t.due>k);
  else if(f==='nodate')a=a.filter(t=>!t.done&&!t.due);
  else if(f==='late')a=a.filter(isLate);
  else if(f==='done')a=a.filter(t=>t.done);
  if(q)a=a.filter(t=>(t.t+' '+(t.n||'')).includes(q));
  const key=t=>(t.due||'9999')+' '+(t.tm||'99:99');
  if(sortBy==='due')a.sort((x,y)=>key(x).localeCompare(key(y)));
  else if(sortBy==='new')a.sort((x,y)=>y.at-x.at);
  else a.sort((x,y)=>(x.p-y.p)||key(x).localeCompare(key(y)));
  return a;
}
function dueLabel(t){
  if(!t.due)return '';const k=td();
  const d=t.due===k?'اليوم':t.due===addDays(k,1)?'غداً':t.due===addDays(k,-1)?'أمس':DN[wdOf(t.due)]+' '+t.due.slice(8)+'/'+t.due.slice(5,7);
  return d+(t.tm?' · '+t12(pm(t.tm)):'');
}
function taskBadge(t){
  const p=PRI[t.p]||PRI[2];
  return '<span class="pill c" style="--c:'+p[1]+'">'+p[0]+'</span>'+(t.due?'<span class="pill'+(isLate(t)?' c" style="--c:#e8806a':'')+'">'+dueLabel(t)+'</span>':'')+(t.al!=null&&t.al>=0&&t.tm?'<span class="pill">منبه</span>':'');
}
function completeTask(id){
  const a=TASKS(),t=a.find(x=>x.id===id);if(!t)return;const k=td();
  const dd=st.get('tdone',{});dd[k]=(dd[k]||0)+1;st.set('tdone',dd);
  if(t.rep&&t.rep!=='none'){const step=t.rep==='daily'?1:7;let d=addDays(t.due&&t.due>k?t.due:k,step);t.due=d;(t.steps||[]).forEach(s=>{s.d=false});t.fired=''}
  else{t.done=true;t.doneAt=k}
  saveTasks(a);
}
function uncompleteTask(id){
  const a=TASKS(),t=a.find(x=>x.id===id);if(!t)return;t.done=false;t.doneAt='';saveTasks(a);
  const dd=st.get('tdone',{}),k=td();if(dd[k]>0){dd[k]--;st.set('tdone',dd)}
}
RD.tasks=()=>{
  const k=td(),all=TASKS(),T0=taskToday(),list=taskList(tFilter,tSort,tQ);
  const cnt=f=>taskList(f).length;
  const wkDone=sum(ago(7).map(d=>D.tdone(d)));
  const filters=[['today','اليوم'],['late','متأخرة'],['up','القادمة'],['nodate','بلا موعد'],['done','منجزة'],['all','الكل']];
  const quick=card('مهمة جديدة','<div class="col"><input type="text" id="tq" placeholder="ماذا تريد أن تنجز؟" data-en="#tqadd">'+
    '<div class="row"><label class="f">اليوم<input type="date" id="tqd" value="'+k+'"></label><label class="f">الساعة<input type="time" id="tqt"></label><label class="f">المنبه<select id="tql">'+opts(LEADS,0)+'</select></label></div>'+
    '<div class="row"><button class="btn" id="tqadd" data-a="tquick">أضف المهمة</button><button class="btn g" data-a="tform">خيارات أكثر</button></div>'+
    '<div class="chips">'+['مراجعة درس','حل مسائل','تلخيص فصل','قراءة 30 صفحة','تمرين الجيم','كتابة ملخص'].map(x=>chip(0,'data-a="ttpl" data-t="'+x+'"',x)).join('')+'</div>'+
    '<div class="mut sm">المنبه يرنّ ويعرض لك المهمة عند موعدها بشرط أن يكون التطبيق مفتوحاً.</div></div>');
  const stats=card('نظرة سريعة','<div class="tiles"><div class="tile"><b>'+T0.done+'/'+(T0.done+T0.open)+'</b><span>مهام اليوم</span></div><div class="tile"><b>'+wkDone+'</b><span>أُنجزت هذا الأسبوع</span></div><div class="tile"><b class="'+(cnt('late')?'bad':'')+'">'+cnt('late')+'</b><span>متأخرة</span></div><div class="tile"><b>'+cnt('up')+'</b><span>قادمة</span></div></div>'+bar(T0.done+T0.open?T0.done/(T0.done+T0.open):0));
  const rows=list.map(t=>{
    const steps=(t.steps||[]),sd=steps.filter(s=>s.d).length;
    return '<li style="align-items:flex-start;flex-wrap:wrap" class="'+(t.done?'done':'')+'"><input type="checkbox" data-c="tchk" data-id="'+t.id+'" '+(t.done?'checked':'')+' aria-label="تم"><div class="t"><div>'+esc(t.t)+'</div><div class="row" style="gap:5px;margin-top:3px">'+taskBadge(t)+'<span class="pill">'+esc(t.c||'أخرى')+'</span>'+(t.rep&&t.rep!=='none'?'<span class="pill">'+(t.rep==='daily'?'يومي':'أسبوعي')+'</span>':'')+(steps.length?'<span class="pill">'+sd+'/'+steps.length+' خطوات</span>':'')+'</div>'+
      (t.n?'<div class="mut sm" style="margin-top:3px;white-space:pre-wrap">'+esc(t.n)+'</div>':'')+
      (steps.length&&!t.done?'<div style="margin-top:4px">'+steps.map((s,i)=>'<label class="row sm" style="gap:8px;margin:2px 0"><input type="checkbox" style="width:18px;height:18px" data-c="tstep" data-id="'+t.id+'" data-i="'+i+'" '+(s.d?'checked':'')+'>'+esc(s.x)+'</label>').join('')+'</div>':'')+'</div>'+
      '<div class="row" style="gap:2px"><button class="btn g s" data-a="tform" data-id="'+t.id+'">تعديل</button><button class="x" data-a="tdel" data-id="'+t.id+'" aria-label="حذف">×</button></div></li>';
  }).join('');
  const lst=card('قائمة المهام','<div class="chips" style="margin-bottom:10px">'+filters.map(f=>chip(tFilter===f[0],'data-a="tfilter" data-f="'+f[0]+'"',f[1]+(f[0]!=='all'&&f[0]!=='done'&&cnt(f[0])?' ('+cnt(f[0])+')':''))).join('')+'</div>'+
    '<div class="row" style="margin-bottom:6px"><input type="search" class="grow" placeholder="بحث في المهام" data-i="tsearch" value="'+esc(tQ)+'"><select data-c="tsort" aria-label="الترتيب">'+opts([['pri','الأهم أولاً'],['due','حسب الموعد'],['new','الأحدث']],tSort)+'</select></div>'+
    (list.length?'<ul class="list">'+rows+'</ul>':'<div class="empty">'+(all.length?'لا مهام في هذا التصنيف':'لا مهام بعد. أضف أول مهمة من الأعلى.')+'</div>')+
    (all.some(t=>t.done)?'<button class="btn g s" data-a="tclear">حذف المنجزة</button>':''),{cls:'full'});
  return '<div class="grid">'+quick+stats+lst+'</div>';
};
INP.tsearch=t=>{tQ=t.value.trim();const p=t.selectionStart;renderSec('tasks');const n=$('[data-i=tsearch]');if(n){n.focus();try{n.setSelectionRange(p,p)}catch(e){}}};

const AL={ring:false,k:'',step:0,stream:null,siv:null,osc:null,test:false,t0:0,sigs:[],busy:false,enroll:null};
const ASTEPS=[
  {id:'face',t:'صوّر وجهك والماء عليه',h:'اغسل وجهك ثم التقط صورة لوجهك وهو مبلل.',cam:'user'},
  {id:'head',t:'صوّر رأسك وشعرك مبللاً',h:'بلّل رأسك بالماء ثم التقط صورة تُظهر شعرك ورأسك.',cam:'user'},
  {id:'rug',t:'صوّر سجادة الصلاة',h:'اذهب لسجادة الصلاة وصوّرها بالكاميرا الخلفية.',cam:'environment'}
];
const alog=()=>cfg.alarm.log;
function alarmMin(k){const w=wdOf(k);return cfg.alarm.mode==='fixed'?pm(cfg.alarm.fixed):pm(winOf(w)[0])-cfg.alarm.lead}
function alarmDone(k){return !!(alog()[k]&&alog()[k].done)}
function nextAlarm(){
  const n=nowMin();
  for(let i=0;i<8;i++){
    const d=addDays(td(),i),w=wdOf(d);if(!cfg.alarm.days.includes(w))continue;
    const m=alarmMin(d);if(i===0&&(alarmDone(d)||n>m+240))continue;
    return{d:d,m:m,i:i,skipped:cfg.alarm.skip===d};
  }
  return null;
}
function alarmInfo(){
  const a=cfg.alarm;if(!a.on)return{text:'المنبه متوقف',sub:'فعّله من قسم المنبه.',canCancel:false,skipped:false};
  const x=nextAlarm();if(!x)return{text:'لا منبه قادم',sub:'اختر أيام التشغيل.',canCancel:false,skipped:false};
  const day=x.i===0?'اليوم':x.i===1?'غداً':DN[wdOf(x.d)];
  return{text:day+' '+t12(x.m)+(x.skipped?' (ملغى)':''),sub:x.skipped?'ألغيت هذا المنبه. لن يرن.':'لا يتوقف حتى تصوّر الماء على وجهك ورأسك وسجادة الصلاة.',canCancel:true,skipped:x.skipped};
}
ACT.almSkip=()=>{const x=nextAlarm();if(!x)return;cfg.alarm.skip=cfg.alarm.skip===x.d?'':x.d;saveCfg();toast(cfg.alarm.skip?'أُلغي منبه '+(x.i===0?'اليوم':x.i===1?'الغد':DN[wdOf(x.d)]):'أُعيد تفعيل المنبه');renderSec(curSec)};

/* ----- الصوت ----- */
function sirenStop(){clearInterval(AL.siv);AL.siv=null;try{if(AL.osc){AL.osc.stop();AL.osc.disconnect()}}catch(e){}AL.osc=null;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}}
function sirenStart(){
  sirenStop();let a;try{ctx();a=ac;if(a.state==='suspended')a.resume()}catch(e){return}
  const s=cfg.alarm.sound,vol=cfg.alarm.vol/100*.55,o=a.createOscillator(),g=a.createGain();o.type=s==='pulse'?'sine':'square';g.gain.value=0;o.connect(g);g.connect(a.destination);o.start();AL.osc=o;
  let i=0;AL.siv=setInterval(()=>{i++;const t=a.currentTime;
    if(s==='siren'){o.frequency.setTargetAtTime(i%2?1100:700,t,.05);g.gain.setTargetAtTime(vol,t,.02)}
    else if(s==='beeps'){o.frequency.value=1000;g.gain.setTargetAtTime(i%4<2?vol:0,t,.01)}
    else{o.frequency.value=480+(i%8)*45;g.gain.setTargetAtTime(vol,t,.02)}
    if(cfg.alarm.vib&&navigator.vibrate&&!AL.test)navigator.vibrate([300,100,300]);
  },400);
}
function notify(title,body,tag){
  try{if(window.Notification&&Notification.permission==='granted'){const o={body:body,tag:tag||'ab',icon:'icon-192.png',vibrate:[200,100,200],requireInteraction:true};
    if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o));else new Notification(title,o)}}catch(e){}
}
/* ----- الكاميرا والتحليل ----- */
async function camStart(facing,vid,msg){
  camStop();AL.nocam=false;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){AL.nocam=true;msg('الكاميرا المباشرة غير متاحة هنا. اضغط «التقط الصورة» لفتح كاميرا الهاتف.');return false}
  try{
    try{AL.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:720},height:{ideal:720}},audio:false})}
    catch(e1){if(e1&&(e1.name==='NotAllowedError'||e1.name==='SecurityError'))throw e1;AL.stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false})}
    vid.setAttribute('playsinline','');vid.muted=true;vid.srcObject=AL.stream;await vid.play().catch(()=>{});return true;
  }catch(e){AL.nocam=true;msg('لم تعمل الكاميرا المباشرة. اضغط «التقط الصورة» لفتح كاميرا الهاتف، أو اسمح للكاميرا من إعدادات المتصفح ثم «إعادة الكاميرا».');return false}
}
function camStop(){try{if(AL.stream)AL.stream.getTracks().forEach(t=>t.stop())}catch(e){}AL.stream=null}
function sampleImg(src,w,h){w=w||96;h=h||72;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);return x.getImageData(0,0,w,h)}
function imgStats(img){
  const d=img.data,n=d.length/4,w=img.width,h=img.height,hist=new Array(64).fill(0),L=new Float32Array(n);
  let skin=0,hl=0,dark=0,lum=0,tx=0;
  for(let i=0;i<n;i++){
    const r=d[i*4],g=d[i*4+1],b=d[i*4+2],y=.299*r+.587*g+.114*b,cb=128-.1687*r-.3313*g+.5*b,cr=128+.5*r-.4187*g-.0813*b,mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0;
    if(cr>133&&cr<177&&cb>77&&cb<130&&y>45)skin++;
    if(mx>225&&s<.24)hl++;
    if(y<55)dark++;
    lum+=y;hist[(r>>6)*16+(g>>6)*4+(b>>6)]++;L[i]=y;
  }
  for(let j=0;j<h;j++)for(let i=1;i<w;i++)tx+=Math.abs(L[j*w+i]-L[j*w+i-1]);
  const sig=[];for(let by=0;by<12;by++)for(let bx=0;bx<16;bx++){let s=0,c=0;for(let j=by*6;j<by*6+6&&j<h;j++)for(let i=bx*6;i<bx*6+6&&i<w;i++){s+=L[j*w+i];c++}sig.push(s/Math.max(1,c))}
  return{skin:skin/n,hl:hl/n,dark:dark/n,lum:lum/n,tex:tx/(n-h),hist:hist.map(v=>v/n),sig:sig};
}
const sigDiff=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=Math.abs(a[i]-b[i]);return s/a.length};
const histInter=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=Math.min(a[i],b[i]);return s};
const SENS={low:{hl:.006,m:.34},mid:{hl:.014,m:.48},high:{hl:.028,m:.6}};
function judge(stepId,s){
  const T=SENS[cfg.alarm.sens]||SENS.mid;
  if(s.lum<28)return{ok:false,msg:'الصورة مظلمة جداً. أضئ المكان وحاول.'};
  if(s.tex<1.4)return{ok:false,msg:'الصورة غير واضحة. ثبّت الهاتف وحاول.'};
  if(stepId==='face'){
    if(s.skin<.12)return{ok:false,msg:'لا يظهر وجهك بوضوح. قرّب الكاميرا منه.'};
    if(s.hl<T.hl)return{ok:false,msg:'لا يظهر لمعان الماء على بشرتك. بلّل وجهك جيداً وواجه الضوء.'};
    return{ok:true};
  }
  if(stepId==='head'){
    if(s.skin<.03&&s.dark<.18)return{ok:false,msg:'لا يظهر رأسك وشعرك. اجعله في وسط الصورة.'};
    if(s.hl<T.hl*.7)return{ok:false,msg:'لا يظهر البلل على رأسك. بلّل شعرك أكثر وحاول.'};
    const f=AL.sigs[0];if(f&&sigDiff(f,s.sig)<5)return{ok:false,msg:'الصورة مطابقة لصورة الوجه. غيّر وضعية الكاميرا لتُظهر رأسك.'};
    return{ok:true};
  }
  if(s.skin>.35)return{ok:false,msg:'يظهر وجهك أكثر من اللازم. وجّه الكاميرا الخلفية نحو سجادة الصلاة.'};
  if(s.tex<2.2)return{ok:false,msg:'لا أرى سجادة. قرّب الكاميرا منها.'};
  const rug=cfg.alarm.rug||[];
  if(rug.length){let best=0;rug.forEach(h=>{best=Math.max(best,histInter(h,s.hist))});if(best<T.m)return{ok:false,msg:'هذه ليست سجادتك المسجلة (تطابق '+Math.round(best*100)+'٪). صوّر سجادة الصلاة نفسها.'}}
  return{ok:true,note:rug.length?'':'لم تسجّل سجادتك بعد، فالتحقق عام.'};
}

const AR_HTML='<div class="ar-in"><div class="ar-t" id="ar-time">--:--</div><div class="ar-s" id="ar-title"></div><div class="ar-dots" id="ar-dots"></div><div class="ar-cam"><video id="ar-v" playsinline muted autoplay></video><div class="ar-flash" id="ar-flash"></div></div><div class="ar-msg" id="ar-msg"></div><div class="row" style="justify-content:center"><button class="btn big" id="ar-shot" data-a="arshot">التقط الصورة</button><button class="btn g" data-a="arretry">إعادة الكاميرا</button></div><input type="file" accept="image/*" capture="user" id="ar-file" data-c="arfile" hidden><div class="row" style="justify-content:center;margin-top:12px"><button class="btn g s" data-a="arsos" id="ar-sos">طوارئ: لا تعمل الكاميرا</button><button class="btn g s" data-a="arstop" id="ar-stop" hidden>إنهاء الاختبار</button></div></div>';
function ensureOverlay(){
  let el=$('#alarm');if(el)return el;
  el=document.createElement('div');el.id='alarm';el.hidden=true;el.setAttribute('role','alertdialog');el.setAttribute('aria-modal','true');
  document.body.appendChild(el);
  el.addEventListener('pointerdown',()=>{try{if(ac&&ac.state==='suspended')ac.resume()}catch(e){}});
  return el;
}
function arMsg(t,bad){const m=$('#ar-msg');if(m){m.textContent=t;m.className='ar-msg'+(bad?' bad':'')}}
function arStep(i){
  AL.step=i;const s=ASTEPS[i];
  $('#ar-title').textContent=s.t;$('#ar-dots').innerHTML=ASTEPS.map((x,j)=>'<i class="'+(j<i?'ok':j===i?'on':'')+'"></i>').join('');
  arMsg(s.h);$('#ar-v').classList.toggle('mir',s.cam==='user');
  camStart(s.cam,$('#ar-v'),t=>arMsg(t,true));
}
function startRing(k,test){
  if(AL.ring)return;AL.ring=true;AL.k=k;AL.test=!!test;AL.t0=Date.now();AL.sigs=[];
  const el=ensureOverlay();el.innerHTML=AR_HTML;el.removeAttribute('data-fin');el.hidden=false;document.body.classList.add('mo');

    if(t.done||t.al==null||t.al<0||!t.tm||!t.due)continue;

/* ========== الحسابات والمزامنة السحابية (اختيارية) ==========
   - تسجيل باسم + اسم مستخدم + كلمة مرور فقط.
   - البيانات تُحفظ محلياً أولاً (تعمل بلا إنترنت) ثم تُرفع إلى جدول user_kv.
   - كل مستخدم يرى صفوفه فقط (RLS في قاعدة البيانات). */
const CLOUD={on:false,client:null,user:null,q:{},timer:null,busy:false,last:0,err:'',off:false};
const LOCAL_ONLY=['tab','snooze','wrem'];
const lsk=k=>'ab:'+k;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const dataKeys=()=>{const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('ab:')&&!k.startsWith('ab:__'))o.push(k.slice(3))}}catch(e){}return o};
function clearLocal(){const ks=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('ab:'))ks.push(k)}}catch(e){}ks.forEach(lsDel)}
CLOUD.init=function(){
  const c=window.INJAZ||{};
  if(!c.supabaseUrl||!c.supabaseAnonKey||!window.supabase)return false;
  try{CLOUD.client=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'injaz-auth'}});CLOUD.on=true;return true}catch(e){return false}
};
CLOUD.email=u=>u+'@'+((window.INJAZ&&window.INJAZ.emailDomain)||'injaz.app');
CLOUD.msg=e=>{
  const m=String((e&&e.message)||e||'').toLowerCase();
  if(m.includes('invalid login'))return 'اسم المستخدم أو كلمة المرور غير صحيحة.';
  if(m.includes('already registered')||m.includes('already been registered'))return 'اسم المستخدم مأخوذ. اختر اسماً آخر.';
  if(m.includes('rate limit')||m.includes('too many'))return 'محاولات كثيرة. انتظر دقائق ثم أعد المحاولة.';
  if(m.includes('password'))return 'كلمة المرور ضعيفة. استخدم 8 أحرف على الأقل.';
  if(m.includes('failed to fetch')||m.includes('network')||!navigator.onLine)return 'تعذر الاتصال بالإنترنت.';
  if(m.includes('email')&&m.includes('confirm'))return 'الخادم يطلب تأكيد البريد. عطّل Confirm email في إعدادات Supabase.';
  return 'تعذر إكمال العملية. أعد المحاولة.';
};
/* ----- الرفع ----- */
cloudTouch=function(k){
  if(!CLOUD.on||!CLOUD.user||LOCAL_ONLY.includes(k)||k.startsWith('__'))return;
  CLOUD.q[k]=1;lsSet('ab:__q',JSON.stringify(CLOUD.q));
  clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(CLOUD.flush,2500);CLOUD.paint();
};
CLOUD.flush=async function(){
  if(!CLOUD.on||!CLOUD.user||CLOUD.busy)return true;
  const ks=Object.keys(CLOUD.q);if(!ks.length)return true;
  if(!navigator.onLine){CLOUD.off=true;CLOUD.paint();return false}
  CLOUD.busy=true;
  try{
    const rows=[];ks.forEach(k=>{const raw=lsGet(lsk(k));if(raw==null)return;try{rows.push({user_id:CLOUD.user.id,k:k,v:JSON.parse(raw)})}catch(e){}});
    if(rows.length){const r=await CLOUD.client.from('user_kv').upsert(rows,{onConflict:'user_id,k'});if(r.error)throw r.error}
    ks.forEach(k=>delete CLOUD.q[k]);lsSet('ab:__q',JSON.stringify(CLOUD.q));CLOUD.last=Date.now();CLOUD.err='';CLOUD.off=false;
  }catch(e){CLOUD.err=CLOUD.msg(e);clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(CLOUD.flush,30000)}
  CLOUD.busy=false;CLOUD.paint();return !CLOUD.err;
};
/* ----- السحب ----- */
CLOUD.fetchAll=async function(){const r=await CLOUD.client.from('user_kv').select('k,v,updated_at');if(r.error)throw r.error;return r.data||[]};
CLOUD.pull=async function(){
  if(!CLOUD.on||!CLOUD.user||!navigator.onLine)return;
  try{
    const rows=await CLOUD.fetchAll();let changed=0;
    rows.forEach(r=>{
      if(CLOUD.q[r.k]||LOCAL_ONLY.includes(r.k))return;
      const s=JSON.stringify(r.v);if(lsGet(lsk(r.k))===s)return;
      lsSet(lsk(r.k),s);changed++;
      if(r.k==='cfg'&&typeof cfg!=='undefined'){const n=merge(JSON.parse(JSON.stringify(DEF)),r.v);Object.keys(cfg).forEach(x=>delete cfg[x]);Object.assign(cfg,n)}
    });
    CLOUD.last=Date.now();CLOUD.off=false;
    if(changed&&typeof renderSec==='function'){try{applySkin();renderSec(curSec)}catch(e){}}
  }catch(e){CLOUD.err=CLOUD.msg(e)}
  CLOUD.paint();
};
/* حالة المزامنة في الواجهة */
CLOUD.paint=function(){
  const b=document.querySelector('[data-a=account]');if(!b)return;
  const n=Object.keys(CLOUD.q).length;
  b.classList.toggle('pend',n>0||!!CLOUD.err||CLOUD.off);
  b.title=CLOUD.err||(CLOUD.off?'غير متصل':(n?'جارٍ الحفظ…':'محفوظ في حسابك'));
};
/* ----- ربط الجهاز بالمستخدم ----- */
CLOUD.adopt=async function(user){
  CLOUD.user=user;
  const prev=lsGet('ab:__uid');
  if(prev===user.id){try{CLOUD.q=JSON.parse(lsGet('ab:__q')||'{}')}catch(e){CLOUD.q={}}return 'ok'}
  let remote=[];
  try{remote=await CLOUD.fetchAll()}catch(e){throw e}
  if(remote.length){
    clearLocal();remote.forEach(r=>lsSet(lsk(r.k),JSON.stringify(r.v)));lsSet('ab:__uid',user.id);return 'reload';
  }
  if(!prev&&dataKeys().length){
    /* بيانات محلية قديمة قبل وجود الحسابات: انقلها إلى الحساب */
    lsSet('ab:__uid',user.id);dataKeys().forEach(k=>{if(!LOCAL_ONLY.includes(k))CLOUD.q[k]=1});lsSet('ab:__q',JSON.stringify(CLOUD.q));return 'ok';
  }
  if(prev&&prev!==user.id){clearLocal();lsSet('ab:__uid',user.id);return 'reload'}
  lsSet('ab:__uid',user.id);return 'ok';
};
CLOUD.begin=async function(user){
  const r=await CLOUD.adopt(user);
  if(r==='reload'){location.reload();return new Promise(()=>{})}
  CLOUD.start();return true;
};
CLOUD.start=function(){
  addEventListener('online',()=>{CLOUD.off=false;CLOUD.flush().then(CLOUD.pull)});
  addEventListener('offline',()=>{CLOUD.off=true;CLOUD.paint()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)CLOUD.flush();else CLOUD.flush().then(CLOUD.pull)});
  setInterval(()=>{if(!document.hidden){CLOUD.flush().then(CLOUD.pull)}},60000);
  CLOUD.flush();
};
/* ----- شاشة الدخول ----- */

  '<div class="chips auth-tabs"><button class="chip'+(su?'':' on')+'" data-a="authmode" data-m="in">دخول</button><button class="chip'+(su?' on':'')+'" data-a="authmode" data-m="up">حساب جديد</button></div>'+
  (su?'<label class="f">الاسم<input id="au-name" type="text" maxlength="40" autocomplete="name" placeholder="اسمك كما تحب أن يظهر"></label>':'')+
  '<label class="f">اسم المستخدم<input id="au-user" type="text" dir="ltr" maxlength="24" autocapitalize="none" autocomplete="username" placeholder="مثال: ahmed.2008" style="text-align:left"></label>'+
  '<label class="f">كلمة المرور<input id="au-pass" type="password" dir="ltr" maxlength="72" autocomplete="'+(su?'new-password':'current-password')+'" placeholder="8 أحرف على الأقل" style="text-align:left"></label>'+
  (su?'<label class="f">تأكيد كلمة المرور<input id="au-pass2" type="password" dir="ltr" maxlength="72" autocomplete="new-password" style="text-align:left"></label><p class="mut sm" style="margin:0">لا توجد وسيلة لاستعادة كلمة المرور، فاحتفظ بها في مكان آمن.</p>':'')+
  '<div class="ar-msg bad" id="au-msg" role="alert"></div>'+
  '<button class="btn big" id="au-go" data-a="authgo" data-m="'+(su?'up':'in')+'">'+(su?'إنشاء الحساب':'دخول')+'</button>'+
  ((window.INJAZ&&window.INJAZ.privacyUrl)?'<p class="mut sm" style="margin:10px 0 0">بالمتابعة توافق على <a href="'+window.INJAZ.privacyUrl+'" target="_blank" rel="noopener">سياسة الخصوصية</a>.</p>':'')+'</div>';
}
let authDone=null;
function showAuth(done){
  authDone=done;document.body.classList.add('lock');
  let el=document.getElementById('auth');if(!el){el=document.createElement('div');el.id='auth';document.body.appendChild(el)}
  el.innerHTML=authMarkup('in');
}
const authMsg=t=>{const m=document.getElementById('au-msg');if(m)m.textContent=t||''};
ACT.authmode=t=>{const el=document.getElementById('auth');if(el)el.innerHTML=authMarkup(t.dataset.m)};
ACT.authgo=async t=>{
  const up=t.dataset.m==='up',u=(document.getElementById('au-user').value||'').trim().toLowerCase(),p=document.getElementById('au-pass').value||'';
  const name=up?(document.getElementById('au-name').value||'').trim().replace(/\s+/g,' '):'';
  if(up&&name.length<2)return authMsg('اكتب اسمك (حرفان على الأقل).');
  if(!/^[a-z0-9._]{3,24}$/.test(u))return authMsg('اسم المستخدم: 3 إلى 24 حرفاً إنجليزياً صغيراً أو أرقاماً أو . أو _');
  if(p.length<8)return authMsg('كلمة المرور 8 أحرف على الأقل.');
  if(up&&p!==document.getElementById('au-pass2').value)return authMsg('كلمتا المرور غير متطابقتين.');
  if(!navigator.onLine)return authMsg('تحتاج اتصالاً بالإنترنت لتسجيل الدخول أو إنشاء الحساب.');
  t.disabled=true;authMsg('');
  try{
    let r;
    if(up){r=await CLOUD.client.auth.signUp({email:CLOUD.email(u),password:p,options:{data:{username:u,name:name}}});if(r.error)throw r.error;if(!r.data.session)throw new Error('email confirm')}
    else{r=await CLOUD.client.auth.signInWithPassword({email:CLOUD.email(u),password:p});if(r.error)throw r.error}
    const user=r.data.user;
    if(up){const keep=lsGet('ab:__uid');if(keep&&keep!==user.id){clearLocal()}CLOUD.user=user;lsSet('ab:profile',JSON.stringify({name:name,username:u}));lsSet('ab:__uid',user.id);CLOUD.q={profile:1};lsSet('ab:__q',JSON.stringify(CLOUD.q));if(dataKeys().length>1){dataKeys().forEach(k=>{if(!LOCAL_ONLY.includes(k))CLOUD.q[k]=1});lsSet('ab:__q',JSON.stringify(CLOUD.q))}CLOUD.start();location.reload();return}
    const res=await CLOUD.begin(user);
    if(res===true){const el=document.getElementById('auth');if(el)el.remove();authDone&&authDone(true)}
  }catch(e){t.disabled=false;authMsg(CLOUD.msg(e))}
};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('auth')){const b=document.getElementById('au-go');if(b&&!b.disabled)b.click()}});
async function cloudGate(){
  if(!CLOUD.init())return true;
  let ses=null;
  try{const r=await CLOUD.client.auth.getSession();ses=r.data&&r.data.session}catch(e){}
  if(ses){
    try{return await CLOUD.begin(ses.user)}catch(e){
      if(lsGet('ab:__uid')===ses.user.id){CLOUD.user=ses.user;CLOUD.off=true;try{CLOUD.q=JSON.parse(lsGet('ab:__q')||'{}')}catch(x){CLOUD.q={}}CLOUD.start();return true}
      throw e}
  }
  const uid=lsGet('ab:__uid');
  if(!navigator.onLine&&uid){CLOUD.user={id:uid};CLOUD.off=true;try{CLOUD.q=JSON.parse(lsGet('ab:__q')||'{}')}catch(e){CLOUD.q={}}CLOUD.start();return true}
  return new Promise(res=>showAuth(res));
}
/* ----- الحساب ----- */

ACT.syncnow=async()=>{toast('جارٍ المزامنة…');const ok=await CLOUD.flush();await CLOUD.pull();toast(ok?'تمت المزامنة':'تعذرت المزامنة، سنعيد المحاولة')};
ACT.logout=()=>ask('سيُسجَّل خروجك وتُزال بياناتك من هذا الجهاز (تبقى في حسابك). متابعة؟','تسجيل الخروج',async()=>{
  toast('جارٍ الحفظ…');const ok=await CLOUD.flush();
  if(!ok&&navigator.onLine&&Object.keys(CLOUD.q).length){toast('تعذر حفظ بعض البيانات. حاول لاحقاً.');return}
  try{await CLOUD.client.auth.signOut()}catch(e){}clearLocal();try{indexedDB.deleteDatabase('ab-bg')}catch(e){}location.reload();
});
ACT.delacct=()=>ask('سيُحذف حسابك وكل بياناتك نهائياً من الخادم ومن هذا الجهاز. لا رجوع بعد ذلك.','حذف نهائي',async()=>{
  try{const r=await CLOUD.client.rpc('delete_my_account');if(r.error)throw r.error}catch(e){toast(CLOUD.msg(e));return}
  try{await CLOUD.client.auth.signOut()}catch(e){}clearLocal();try{indexedDB.deleteDatabase('ab-bg');indexedDB.deleteDatabase('ab-lib')}catch(e){}location.reload();
},true);
CLOUD.mountUi=function(){
  const t=document.querySelector('.tact');if(!t||t.querySelector('[data-a=account]'))return;
  const b=document.createElement('button');b.className='ib';b.dataset.a='account';b.setAttribute('aria-label','حسابي');
  b.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.9-3.6 3.8-5.4 7.5-5.4s6.6 1.8 7.5 5.4"/></svg>';t.insertBefore(b,t.firstChild);CLOUD.paint();
};

/* ========== منبّهات النظام (Android عبر Capacitor) ==========
   تُجدول إشعارات دقيقة يشغّلها نظام أندرويد نفسه، فتعمل والتطبيق مغلق والشاشة مقفلة.
   في المتصفح العادي لا يفعل هذا الملف شيئاً. */
const NAT={ok:false,sig:'',LN:null};
function natInit(){
  const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  NAT.LN=C.Plugins&&C.Plugins.LocalNotifications;if(!NAT.LN)return;NAT.ok=true;
  (async()=>{
    try{
      const p=await NAT.LN.checkPermissions();
      if(p.display!=='granted')await NAT.LN.requestPermissions();
      await NAT.LN.createChannel({id:'alarm',name:'المنبّهات',description:'منبّه الصباح وتنبيهات المهام',importance:5,visibility:1,vibration:true,sound:'alarm.wav',lights:true});
      NAT.LN.addListener('localNotificationActionPerformed',e=>{
        const x=(e.notification&&e.notification.extra)||{};
        setTimeout(()=>{try{if(x.t==='morning'&&!alarmDone(x.d))startRing(x.d,false);else if(x.t==='task'){const t=TASKS().find(y=>y.id===x.id);if(t&&!t.done)showTaskAlarm(t)}}catch(_){}},400);
      });
      natSync(true);setInterval(()=>natSync(false),30000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)natSync(true)});
    }catch(e){}
  })();
}
const natId=s=>{let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 2000+Math.abs(h)%2000000000};
async function natSync(force){
  if(!NAT.ok)return;
  const items=[],now=Date.now(),a=cfg.alarm;
  if(a.on){
    for(let i=0;i<8;i++){
      const d=addDays(td(),i),w=wdOf(d);if(!a.days.includes(w)||a.skip===d||alarmDone(d))continue;
      const m=alarmMin(d),at=new Date(d+'T00:00:00');at.setMinutes(m);
      if(at.getTime()<=now)continue;
      items.push({id:100+i,title:'منبّه الصباح',body:'استيقظ الآن. افتح التطبيق لإيقافه.',schedule:{at:at,allowWhileIdle:true},channelId:'alarm',sound:'alarm.wav',extra:{t:'morning',d:d},ongoing:false,autoCancel:true});
    }
  }
  const snz=SNZ();
  TASKS().forEach(t=>{
    if(t.done||t.al==null||t.al<0||!t.tm||!t.due)return;
    let at=taskDue(t)-t.al*60000;if(snz[t.id])at=Math.max(at,snz[t.id]);
    if(at<=now||at>now+14*864e5)return;
    items.push({id:natId(String(t.id)),title:'مهمة: '+(t.t||''),body:'حان موعدها '+t.tm,schedule:{at:new Date(at),allowWhileIdle:true},channelId:'alarm',sound:'alarm.wav',extra:{t:'task',id:t.id}});
  });
  const sig=JSON.stringify(items.map(x=>[x.id,+x.schedule.at]));
  if(!force&&sig===NAT.sig)return;NAT.sig=sig;
  try{
    const pend=await NAT.LN.getPending();
    if(pend.notifications&&pend.notifications.length)await NAT.LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    if(items.length)await NAT.LN.schedule({notifications:items});
  }catch(e){}
}

/* ========== الدخول والتشغيل ========== */
async function unlock(){
  let ok=true;
  try{ok=await cloudGate()}catch(e){ok=true}
  if(!ok)return;
  document.body.classList.remove('lock');const a=document.getElementById('auth');if(a)a.remove();
  if(!me()){await askName()}
  boot();CLOUD.mountUi();welcome();
}
function askName(){return new Promise(res=>{
  document.body.classList.add('lock');
  const el=document.createElement('div');el.id='auth';
  el.innerHTML='<div class="auth-in"><div class="auth-logo"></div><h1>'+APP_NAME+'</h1><p class="mut">اكتب اسمك لنبدأ.</p><label class="f">الاسم<input id="au-name" type="text" maxlength="40" autocomplete="name" placeholder="اسمك كما تحب أن يظهر"></label><div class="ar-msg bad" id="au-msg"></div><button class="btn big" id="au-go">ابدأ</button></div>';
  document.body.appendChild(el);
  const go=()=>{const n=(el.querySelector('#au-name').value||'').trim().replace(/\s+/g,' ');if(n.length<2){el.querySelector('#au-msg').textContent='اكتب اسمك (حرفان على الأقل).';return}
    const p=st.get('profile',{});p.name=n;st.set('profile',p);el.remove();document.body.classList.remove('lock');res()};
  el.querySelector('#au-go').onclick=go;el.querySelector('#au-name').onkeydown=e=>{if(e.key==='Enter')go()};
})}
function welcome(){const n=firstName();setTimeout(()=>toast(greeting()+(n?' يا '+n:'')+' 👋',3600),500)}
let booted=false;
function boot(){
  if(booted)return;booted=true;
  buildShell();
  loadBgImg().then(()=>applySkin());
  if(cfg.bg.ver!==2){if(cfg.bg.fixed!=='custom'){cfg.bg.mode='fixed';cfg.bg.fixed='night';cfg.bg.per={}}cfg.bg.ver=2;saveCfg()}
  const h=(location.hash||'').slice(1),tab=SEC.find(s=>s.id===h)?h:st.get('tab','home');
  go(tab);
  clock();setInterval(clock,20000);
  alarmInit();natInit();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(SEC.find(s=>s.id===h)&&h!==curSec)go(h)});
unlock();
