name: Build Android (APK + AAB)
on:
  workflow_dispatch:
  push:
    paths: ['injaz/**','.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: injaz/mobile } }
    env:
      VCODE: ${{ github.run_number }}
      VNAME: 1.0.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: pip install --break-system-packages pillow
      - run: mkdir -p www && cp ../dist/index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: مفتاح التوقيع
        run: |
          if [ -n "${{ secrets.KS_BASE64 }}" ]; then
            echo "${{ secrets.KS_BASE64 }}" | base64 -d > android/app/upload.jks
            echo "KS_PASS=${{ secrets.KS_PASS }}" >> $GITHUB_ENV
            echo "KS_ALIAS=upload" >> $GITHUB_ENV
          else
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -v -keystore android/app/upload.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass $PASS -keypass $PASS -dname "CN=Injaz, O=Injaz, C=EG"
            echo "KS_PASS=$PASS" >> $GITHUB_ENV
            echo "KS_ALIAS=upload" >> $GITHUB_ENV
            mkdir -p ../keystore && cp android/app/upload.jks ../keystore/upload.jks
            echo "$PASS" > ../keystore/PASSWORD.txt
            base64 -w0 android/app/upload.jks > ../keystore/KS_BASE64.txt
          fi
      - run: python3 tools/patch_android.py android ../dist
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: injaz-play-bundle
          path: |
            injaz/mobile/android/app/build/outputs/bundle/release/app-release.aab
            injaz/mobile/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('injaz/mobile/../keystore/upload.jks') != '' }}
        with:
          name: injaz-KEYSTORE-احفظه-في-مكان-آمن
          path: injaz/keystore/
